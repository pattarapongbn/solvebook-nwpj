name: Daily crawl

on:
  schedule:
    # 06:00 เวลาไทย (23:00 UTC)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      keywords:
        description: "Extra comma-separated keywords (optional)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run crawler
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.crawlers.run \
            --keywords-file ../crawl/keywords.txt \
            --keywords "${{ github.event.inputs.keywords }}" \
            --sources amazon,1688 \
            --limit 10
